services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: newdawn
      POSTGRES_USER: newdawn
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-newdawn_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newdawn -d newdawn"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-newdawn}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-newdawn_minio_password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-newdawn} ${S3_SECRET_KEY:-newdawn_minio_password};
      mc mb --ignore-existing local/${S3_BUCKET:-new-dawn};
      exit 0;
      "

  server:
    build: ./server
    profiles: ["full"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DATABASE_URL: jdbc:postgresql://postgres:5432/newdawn
      DATABASE_USER: newdawn
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-newdawn_dev_password}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-newdawn}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-newdawn_minio_password}
      S3_BUCKET: ${S3_BUCKET:-new-dawn}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-64-character-minimum-secret-before-production-1234567890}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeThisAdminPassword123!}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      S3_REGION: ${S3_REGION:-us-east-1}
      LEGACY_UPDATER_ENABLED: ${LEGACY_UPDATER_ENABLED:-false}
      LEGACY_UPDATER_BIND_ADDRESS: 0.0.0.0
      LEGACY_UPDATER_PORT: ${LEGACY_UPDATER_PORT:-4040}
      LEGACY_UPDATER_CHANNEL: ${LEGACY_UPDATER_CHANNEL:-STABLE}
      LEGACY_UPDATER_GAME_FILE_NAME: ${LEGACY_UPDATER_GAME_FILE_NAME:-FOnline}
      LEGACY_UPDATER_NEWS_URL: ${LEGACY_UPDATER_NEWS_URL:-https://fonline-nd.com}
      BACKUP_MAX_FILE_SIZE: ${BACKUP_MAX_FILE_SIZE:-2GB}
    ports:
      - "127.0.0.1:8080:8080"
      # Migration-only plaintext endpoint. It remains host-local until an nginx
      # stream proxy is explicitly enabled.
      - "127.0.0.1:${LEGACY_UPDATER_HOST_PORT:-14040}:${LEGACY_UPDATER_PORT:-4040}"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
