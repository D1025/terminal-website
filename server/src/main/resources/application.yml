spring:
  application:
    name: new-dawn-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/newdawn}
    username: ${DATABASE_USER:newdawn}
    password: ${DATABASE_PASSWORD:newdawn_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${BACKUP_MAX_FILE_SIZE:2GB}
      max-request-size: ${BACKUP_MAX_FILE_SIZE:2GB}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: ${JWT_ISSUER:https://newdawn.local}
    audience: ${JWT_AUDIENCE:new-dawn-api}
    secret: ${JWT_SECRET:dev-only-change-this-64-character-minimum-secret-before-production-1234567890}
    access-ttl: ${JWT_ACCESS_TTL:PT10M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  cookies:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Strict}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeThisAdminPassword123!}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:new-dawn}
    access-key: ${S3_ACCESS_KEY:newdawn}
    secret-key: ${S3_SECRET_KEY:newdawn_minio_password}
    path-style: ${S3_PATH_STYLE:true}
    upload-url-ttl: ${S3_UPLOAD_URL_TTL:PT15M}
    download-url-ttl: ${S3_DOWNLOAD_URL_TTL:PT15M}
  legacy-updater:
    enabled: ${LEGACY_UPDATER_ENABLED:false}
    bind-address: ${LEGACY_UPDATER_BIND_ADDRESS:0.0.0.0}
    port: ${LEGACY_UPDATER_PORT:4040}
    channel: ${LEGACY_UPDATER_CHANNEL:STABLE}
    game-file-name: ${LEGACY_UPDATER_GAME_FILE_NAME:FOnline}
    news-url: ${LEGACY_UPDATER_NEWS_URL:https://fonline-nd.com}
