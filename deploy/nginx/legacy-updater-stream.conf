# Migration-only TCP proxy for the existing FOnline updater protocol.
# Load this file from nginx.conf at the top level (not inside an `http` block).
# The backend listener is bound to 127.0.0.1 by compose.yaml and is therefore
# not reachable from the public network without this explicit stream proxy.

stream {
    upstream newdawn_legacy_updater {
        server 127.0.0.1:14040;
    }

    server {
        listen 4040;
        proxy_pass newdawn_legacy_updater;
        proxy_connect_timeout 5s;
        proxy_timeout 30m;
    }
}

# If nginx runs in the same Docker network, use `server:4040` upstream and
# remove the 127.0.0.1:14040 host mapping from compose.yaml.
