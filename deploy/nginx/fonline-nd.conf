# The application, PostgreSQL and MinIO ports are bound to 127.0.0.1 in compose.yaml.
# When nginx runs inside the same Docker network, replace 127.0.0.1 with the service
# names `server` and `minio` and remove the corresponding host port mappings.

upstream newdawn_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream newdawn_storage {
    server 127.0.0.1:9000;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name updater.fonline-nd.com;

    # Configure certificates using the deployment's ACME/certificate manager.
    ssl_certificate     /etc/letsencrypt/live/updater.fonline-nd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updater.fonline-nd.com/privkey.pem;

    location = /api/v1/updates/manifest {
        limit_except GET { deny all; }
        proxy_pass http://newdawn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/updates/files/[0-9a-fA-F-]{36}/download$ {
        limit_except GET { deny all; }
        proxy_pass http://newdawn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    server_name storage.fonline-nd.com;

    ssl_certificate     /etc/letsencrypt/live/storage.fonline-nd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.fonline-nd.com/privkey.pem;

    # Browser uploads and launcher downloads go directly to S3-compatible storage.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://newdawn_storage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# The main fonline-nd.com virtual host should proxy /api/ to newdawn_api and
# serve the built React application for every other route. Do not expose the
# admin endpoints on updater.fonline-nd.com.
